<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family interest map · Venn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --border-soft: #ececef;
    --text: #18181b;
    --text-2: #52525b;
    --text-3: #71717a;
    --text-4: #a1a1aa;
    --eli: #4a72b8;
    --maya: #6b8e4e;
    --david: #8a6ab0;
    --rachel: #c2410c;
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    --font-jp: 'Noto Sans JP', var(--font-sans);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
    line-height: 1.4;
    overflow: hidden;
  }
  body.noframe { background: transparent; }

  .page {
    width: 100%;
    height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    padding: 24px 32px;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .head__title {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.6px;
    color: var(--text-2);
  }
  .head__meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
  }

  .stage {
    flex: 1;
    position: relative;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
  }

  .circle {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: multiply;
  }
  .c-eli    { width: 360px; height: 360px; left: 60px;   top: 30px;
              background: rgba(74,114,184,0.20);  border: 1px solid rgba(74,114,184,0.35); }
  .c-maya   { width: 360px; height: 360px; left: 320px;  top: 30px;
              background: rgba(107,142,78,0.20);  border: 1px solid rgba(107,142,78,0.35); }
  .c-david  { width: 360px; height: 360px; left: 60px;   top: 200px;
              background: rgba(138,106,176,0.18); border: 1px solid rgba(138,106,176,0.35); }
  .c-rachel { width: 360px; height: 360px; left: 320px;  top: 200px;
              background: rgba(194,65,12,0.16);   border: 1px solid rgba(194,65,12,0.35); }

  .label {
    position: absolute;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }
  .l-eli    { left: 60px;  top: 12px;  color: var(--eli); }
  .l-maya   { right: 60px; top: 12px;  color: var(--maya); }
  .l-david  { left: 60px;  bottom: 12px;  color: var(--david); }
  .l-rachel { right: 60px; bottom: 12px;  color: var(--rachel); }

  .tag {
    position: absolute;
    z-index: 5;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(15,15,20,0.05);
    font-family: var(--font-jp);
    white-space: nowrap;
  }
  .tag--center {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
    font-weight: 600;
  }
  .tag--lock {
    background: rgba(194,65,12,0.06);
    border-color: rgba(194,65,12,0.4);
    color: var(--rachel);
    padding-left: 24px;
  }
  .tag--lock::before {
    content: '';
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-50%);
    width: 9px; height: 11px;
    background: var(--rachel);
    border-radius: 1px;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 14'><path fill='black' d='M6 0a4 4 0 0 0-4 4v2H1v8h10V6h-1V4a4 4 0 0 0-4-4zm-2 6V4a2 2 0 1 1 4 0v2H4z'/></svg>") no-repeat center / contain;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 14'><path fill='black' d='M6 0a4 4 0 0 0-4 4v2H1v8h10V6h-1V4a4 4 0 0 0-4-4zm-2 6V4a2 2 0 1 1 4 0v2H4z'/></svg>") no-repeat center / contain;
  }

  /* Tag positions */
  .t-center  { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .t-center2 { left: 50%; top: calc(50% + 28px); transform: translate(-50%, -50%); }
  .t-center3 { left: 50%; top: calc(50% - 28px); transform: translate(-50%, -50%); }

  .t-eli-david   { left: 110px; top: 50%; transform: translate(0, -50%); }
  .t-eli-maya    { left: 50%;   top: 88px; transform: translate(-50%, 0); }
  .t-maya-rachel { right: 110px; top: 50%; transform: translate(0, -50%); }

  .t-eli-only    { left: 90px;  top: 130px; }
  .t-maya-only   { right: 90px; top: 130px; }
  .t-david-only  { left: 80px;  bottom: 130px; }
  .t-rachel-only { right: 60px; bottom: 130px; }

  .legend {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 12px 20px;
    border-top: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }
  .legend__item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.6px;
  }
  .swatch { width: 12px; height: 12px; border-radius: 50%; }
  .s-eli    { background: rgba(74,114,184,0.4); }
  .s-maya   { background: rgba(107,142,78,0.4); }
  .s-david  { background: rgba(138,106,176,0.4); }
  .s-rachel { background: rgba(194,65,12,0.35); }
  .s-shared { background: var(--text); }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).has('noframe')) document.body.classList.add('noframe');
</script>

<div class="page">
  <div class="head">
    <div class="head__title">FAMILY INTEREST MAP · 6 MONTHS BEFORE</div>
    <div class="head__meta">23 entries · Brain-inferred · 4 members</div>
  </div>

  <div class="stage">
    <div class="label l-eli">ELI · 13</div>
    <div class="label l-maya">MAYA · 6</div>
    <div class="label l-david">DAVID</div>
    <div class="label l-rachel">RACHEL</div>

    <div class="circle c-eli"></div>
    <div class="circle c-maya"></div>
    <div class="circle c-david"></div>
    <div class="circle c-rachel"></div>

    <!-- Family-wide center -->
    <div class="tag tag--center t-center3">Ghibli</div>
    <div class="tag tag--center t-center">Food</div>
    <div class="tag tag--center t-center2">抹茶</div>

    <!-- Pair overlaps -->
    <div class="tag t-eli-maya">Pokémon</div>
    <div class="tag t-eli-david">呪術回戦</div>
    <div class="tag t-maya-rachel">craft + sweets</div>

    <!-- Solo only -->
    <div class="tag tag--lock t-eli-only">鬼滅 (forge)</div>
    <div class="tag t-maya-only">ねこちゃん</div>
    <div class="tag t-david-only">literary fiction</div>
    <div class="tag t-rachel-only">art + 写真</div>
  </div>

  <div class="legend">
    <div class="legend__item"><span class="swatch s-eli"></span> ELI</div>
    <div class="legend__item"><span class="swatch s-maya"></span> MAYA</div>
    <div class="legend__item"><span class="swatch s-david"></span> DAVID</div>
    <div class="legend__item"><span class="swatch s-rachel"></span> RACHEL</div>
    <div class="legend__item"><span class="swatch s-shared"></span> FAMILY-WIDE</div>
    <div class="legend__item"><span class="swatch" style="background: var(--rachel);"></span> SURPRISE MODE (locked)</div>
  </div>
</div>

</body>
</html>
