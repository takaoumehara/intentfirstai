<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya · おしおり · Day 8 Kanazawa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_screen.css">
<style>
  :root {
    --maya-mint:   #d4f0e0;
    --maya-mint-2: #b6e3c8;
    --maya-coral:  #ffd9c4;
    --maya-coral-2:#ffbfa0;
    --maya-cream:  #fff5d8;
    --maya-cream-2:#ffe7a4;
    --maya-sky:    #d6ecf6;
    --maya-ink:    #2d2a1e;
    --maya-ink-2:  #6b6452;
  }
  body {
    font-family: 'Noto Sans JP', var(--font-sans);
    background: linear-gradient(180deg, #fffaf0 0%, #fff5e8 100%);
    color: var(--maya-ink);
  }
  body.noframe { background: linear-gradient(180deg, #fffaf0 0%, #fff5e8 100%); }

  .kids-app {
    padding: 24px 28px 28px;
    max-width: 1024px;
    margin: 0 auto;
  }
  body.noframe .kids-app { padding-top: 28px; }

  .kids-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }
  .kids-head__name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--maya-ink);
  }
  .kids-head__day {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 2px 0 var(--maya-cream-2);
    font-size: 15px;
    font-weight: 700;
    color: var(--maya-ink);
  }
  .kids-head__day .star { color: #f5a623; }

  .kids-section-title {
    font-size: 24px;
    font-weight: 700;
    margin: 8px 0 16px;
    letter-spacing: 0.4px;
  }

  .today-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .big-card {
    min-height: 168px;
    border-radius: 22px;
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 0 rgba(0,0,0,0.04);
    transition: transform 160ms var(--ease-out-quart);
  }
  .big-card:active { transform: scale(0.98); }
  .big-card--mint  { background: var(--maya-mint);  box-shadow: 0 4px 0 var(--maya-mint-2); }
  .big-card--coral { background: var(--maya-coral); box-shadow: 0 4px 0 var(--maya-coral-2); }
  .big-card--cream { background: var(--maya-cream); box-shadow: 0 4px 0 var(--maya-cream-2); }

  .big-card__icon {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: #ffffff;
    display: grid;
    place-items: center;
    margin-bottom: 4px;
  }
  .big-card__icon svg { width: 32px; height: 32px; }
  .big-card__time {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--maya-ink-2);
    margin-bottom: 4px;
  }
  .big-card__label {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--maya-ink);
  }

  /* Cat ribbon */
  .ribbon {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-radius: 22px;
    background: #ffffff;
    box-shadow: 0 4px 0 var(--maya-cream-2);
    margin-bottom: 20px;
  }
  .ribbon__icon {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: var(--maya-coral);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .ribbon__title {
    font-size: 18px;
    font-weight: 700;
    color: var(--maya-ink);
    margin-bottom: 4px;
  }
  .stamp-track {
    display: flex;
    gap: 6px;
  }
  .stamp {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px dashed #cdb89a;
    background: transparent;
  }
  .stamp--filled {
    background: #f5a623;
    border-color: #f5a623;
    color: #fff;
    display: grid; place-items: center;
    font-size: 12px;
    font-weight: 700;
  }
  .stamp__count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--maya-ink);
  }

  /* Surprise locked card */
  .surprise {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 18px 22px;
    border-radius: 22px;
    background: linear-gradient(135deg, #efe6ff 0%, #fce8ff 100%);
    box-shadow: 0 4px 0 #d8c8f0;
    margin-bottom: 24px;
  }
  .surprise__icon {
    width: 56px; height: 56px;
    border-radius: 18px;
    background: #ffffff;
    display: grid; place-items: center;
  }
  .surprise__title {
    font-size: 19px;
    font-weight: 700;
    color: #4b3a6b;
    margin-bottom: 2px;
  }
  .surprise__sub {
    font-size: 14px;
    color: #6e5a8e;
    font-weight: 500;
  }
  .surprise__day {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: #6e5a8e;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.6);
  }

  /* Bottom nav */
  .kids-nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 8px;
    border-radius: 22px;
    background: #ffffff;
    box-shadow: 0 4px 0 var(--maya-cream-2);
  }
  .kids-nav__item {
    min-height: 56px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    color: var(--maya-ink-2);
  }
  .kids-nav__item--active {
    background: var(--maya-mint);
    color: var(--maya-ink);
  }

  @media (max-width: 768px) {
    .today-grid { grid-template-columns: 1fr; }
    .kids-section-title { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="kids-app">

  <header class="kids-head reveal" data-d="1">
    <div class="kids-head__name">MAYA · 9 さい · おしおり</div>
    <div class="kids-head__day"><span class="star">★</span> Day 8 · かなざわ</div>
  </header>

  <h1 class="kids-section-title reveal" data-d="2">きょうの よてい</h1>

  <div class="today-grid">
    <div class="big-card big-card--mint reveal" data-d="3">
      <div class="big-card__icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="14" r="6" fill="#7fb89a"/><path d="M6 26c2-4 6-6 10-6s8 2 10 6" stroke="#7fb89a" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="big-card__time">7:30</div>
        <div class="big-card__label">あさごはん</div>
      </div>
    </div>
    <div class="big-card big-card--coral reveal" data-d="4">
      <div class="big-card__icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><rect x="6" y="6" width="20" height="20" rx="3" fill="#f5a623"/><rect x="9" y="9" width="14" height="14" rx="1" fill="#fff7d9"/></svg>
      </div>
      <div>
        <div class="big-card__time">10:00</div>
        <div class="big-card__label">きんぱく<br>たいけん</div>
      </div>
    </div>
    <div class="big-card big-card--cream reveal" data-d="5">
      <div class="big-card__icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M8 10l4-4 2 4M24 10l-4-4-2 4" stroke="#c87f5e" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="18" r="8" fill="#c87f5e"/><circle cx="13" cy="17" r="1.2" fill="#fff"/><circle cx="19" cy="17" r="1.2" fill="#fff"/></svg>
      </div>
      <div>
        <div class="big-card__time">16:30</div>
        <div class="big-card__label">ねこちゃん<br>カフェ</div>
      </div>
    </div>
  </div>

  <div class="ribbon reveal" data-d="6">
    <div class="ribbon__icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28" fill="none"><path d="M8 10l3-3 2 3M24 10l-3-3-2 3" stroke="#c87f5e" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="18" r="8" fill="#c87f5e"/></svg>
    </div>
    <div style="flex:1;">
      <div class="ribbon__title">ねこちゃん スタンプ</div>
      <div class="stamp-track">
        <span class="stamp stamp--filled">★</span>
        <span class="stamp stamp--filled">★</span>
        <span class="stamp stamp--filled">★</span>
        <span class="stamp stamp--filled">★</span>
        <span class="stamp"></span>
        <span class="stamp"></span>
        <span class="stamp"></span>
        <span class="stamp"></span>
      </div>
    </div>
    <div class="stamp__count">4 / 8</div>
  </div>

  <div class="surprise reveal" data-d="7" aria-label="Locked surprise day">
    <div class="surprise__icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="32" height="32" fill="none"><rect x="9" y="14" width="14" height="12" rx="2" fill="#a78bd0"/><path d="M12 14v-3a4 4 0 018 0v3" stroke="#a78bd0" stroke-width="2.5"/><circle cx="16" cy="20" r="1.5" fill="#fff"/></svg>
    </div>
    <div>
      <div class="surprise__title">とくべつなひ</div>
      <div class="surprise__sub">なにがあるかは、いってからのおたのしみ</div>
    </div>
    <div class="surprise__day">DAY 10</div>
  </div>

  <nav class="kids-nav reveal" data-d="8" aria-label="Bottom navigation">
    <div class="kids-nav__item kids-nav__item--active">きょう</div>
    <div class="kids-nav__item">あした</div>
    <div class="kids-nav__item">ぜんぶ</div>
    <div class="kids-nav__item">おえかき</div>
  </nav>

</div>

<script>
  if (new URLSearchParams(location.search).has('noframe')) document.body.classList.add('noframe');
</script>
</body>
</html>
