<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S23 · Aoyama recall · 8-month-old save</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_screen.css">
<style>
  body {
    background:
      linear-gradient(180deg, #d8e4f0 0%, #c8d8e8 100%);
  }
  body.noframe { background: transparent; }

  .lock-time {
    text-align: center;
    padding-top: 36px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .lock-time__time {
    font-size: 86px;
    font-weight: 300;
    letter-spacing: -3px;
    line-height: 1;
  }
  .lock-time__date {
    font-size: 17px;
    font-weight: 500;
    margin-top: 4px;
    letter-spacing: -0.2px;
  }

  .notification {
    margin: 36px 14px 0;
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 24px 48px rgba(15,15,30,0.18), 0 4px 12px rgba(15,15,30,0.10);
    animation: slide-in 320ms var(--ease-out-quint) both;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .notification { animation: none; }
  }

  .notif-head {
    padding: 12px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .notif-app {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-2);
    font-weight: 600;
  }
  .notif-app__icon {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg, #8a6ab0, #6b4d8e);
    color: #fff;
    display: grid; place-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0;
  }
  .notif-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.4px;
  }

  .audience {
    margin: 0 16px 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    background: rgba(194,65,12,0.10);
    border: 1px solid rgba(194,65,12,0.25);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--warm);
  }

  .photo {
    height: 160px;
    margin: 8px 12px 12px;
    border-radius: 14px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%),
      linear-gradient(135deg, #2a3a52 0%, #1c2738 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 12px;
  }
  .photo::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 18px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 14px);
  }
  .photo__caption {
    position: relative;
    z-index: 2;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .body {
    padding: 0 18px 16px;
  }
  .title {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: var(--text);
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .detail {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .saved {
    padding-top: 10px;
    border-top: 1px solid rgba(0,0,0,0.06);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.4px;
    font-style: italic;
  }

  .actions {
    padding: 0 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .action-btn {
    width: 100%;
    min-height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(0,0,0,0.06);
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
  }
  .action-btn--primary {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).has('noframe')) document.body.classList.add('noframe');
</script>

<div class="status-bar">
  <span>14:23</span>
  <span class="status-bar__icons mono">5G · 71%</span>
</div>

<div class="lock-time">
  <div class="lock-time__time">14:23</div>
  <div class="lock-time__date">Saturday, March 21 · Day 8</div>
</div>

<div class="notification">
  <div class="notif-head">
    <div class="notif-app">
      <div class="notif-app__icon">TB</div>
      <span>Trip Brain</span>
    </div>
    <div class="notif-time">now</div>
  </div>

  <div class="audience">RACHEL · MAYA · ONLY</div>

  <div class="photo">
    <div class="photo__caption">8 MONTHS AGO · SAVED BY YOU</div>
  </div>

  <div class="body">
    <div class="title">Aoyama 2D café · matcha sweets nearby</div>
    <div class="detail">5 min walk · 30 min wait predicted · cash ¥800–1,200 / person</div>
    <div class="saved">You saved this 2025-09-15 at 02:11 — "for Maya 2026 trip"</div>
  </div>

  <div class="actions">
    <button class="action-btn action-btn--primary">Go now · 5 min walk</button>
    <button class="action-btn">Save for later today</button>
    <button class="action-btn">Show on map</button>
  </div>
</div>

<div class="home-indicator"></div>
</body>
</html>
