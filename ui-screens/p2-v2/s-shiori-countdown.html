<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya · Countdown · あと27にち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_screen.css">
<style>
  :root {
    --maya-mint:   #d4f0e0;
    --maya-coral:  #ffd9c4;
    --maya-cream:  #fff5d8;
    --maya-pink:   #ffd1e1;
    --maya-ink:    #2d2a1e;
    --maya-ink-2:  #6b6452;
  }
  body {
    font-family: 'Noto Sans JP', var(--font-sans);
    background: linear-gradient(160deg, #fff5e8 0%, #ffe6f0 60%, #e6f7ec 100%);
    color: var(--maya-ink);
  }
  body.noframe {
    background: linear-gradient(160deg, #fff5e8 0%, #ffe6f0 60%, #e6f7ec 100%);
  }

  .cd-app {
    padding: 20px 28px 28px;
    max-width: 1024px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  body.noframe .cd-app { padding-top: 28px; }

  .cd-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cd-top__title {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 1.6px;
    color: var(--maya-ink-2);
    text-transform: uppercase;
  }
  .cd-top__season {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 2px 0 #f5d4dd;
    font-size: 14px;
    font-weight: 700;
    color: var(--maya-ink);
  }

  /* Big counter */
  .cd-counter {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 16px;
    gap: 14px;
  }
  .cd-counter__pre {
    font-size: 28px;
    font-weight: 700;
    color: var(--maya-ink);
    line-height: 1;
  }
  .cd-counter__num {
    font-family: 'Geist', var(--font-sans);
    font-size: clamp(120px, 24vw, 200px);
    font-weight: 800;
    line-height: 0.85;
    letter-spacing: -4px;
    color: var(--maya-ink);
    background: linear-gradient(135deg, #f5a623 0%, #ec5b73 50%, #a78bd0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .cd-counter__post {
    font-size: 28px;
    font-weight: 700;
    color: var(--maya-ink);
    line-height: 1;
  }

  /* Today unlock card */
  .unlock-card {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 18px 22px;
    border-radius: 22px;
    background: #ffffff;
    box-shadow: 0 4px 0 #f5d4dd;
    margin-bottom: 12px;
    transition: transform 160ms var(--ease-out-quart);
  }
  .unlock-card:active { transform: scale(0.99); }
  .unlock-card__star {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #ffd97a 0%, #ffaf6b 100%);
    display: grid;
    place-items: center;
    font-size: 28px;
    color: #fff;
    font-weight: 700;
    flex-shrink: 0;
  }
  .unlock-card__label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    color: #c87f5e;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .unlock-card__title {
    font-size: 19px;
    font-weight: 700;
    color: var(--maya-ink);
    line-height: 1.25;
  }
  .unlock-card__arrow {
    font-size: 26px;
    color: #c87f5e;
    font-weight: 700;
  }

  .lock-meta {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--maya-ink-2);
    margin-bottom: 16px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.6);
  }
  .lock-meta .key {
    display: inline-block;
    margin-right: 6px;
    color: #a78bd0;
  }

  /* Family avatars + nighttime button */
  .cd-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 16px;
    border-radius: 22px;
    background: #ffffff;
    box-shadow: 0 4px 0 #d6e9d8;
  }
  .avatars {
    display: flex;
    gap: -6px;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid #fff;
    margin-left: -10px;
    display: grid; place-items: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .avatar:first-child { margin-left: 0; }
  .avatar--maya   { background: #ec5b73; }
  .avatar--eli    { background: #7c3aed; }
  .avatar--rachel { background: #6b8e4e; }
  .avatar--david  { background: #c2410c; }

  .bedtime-btn {
    min-height: 48px;
    padding: 0 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, #a78bd0 0%, #7c5fb5 100%);
    color: #fff;
    font-family: 'Noto Sans JP', var(--font-sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: none;
    box-shadow: 0 3px 0 #6a4f9c;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .bedtime-btn:active { transform: translateY(1px); box-shadow: 0 2px 0 #6a4f9c; }

  /* Sparkle dots floating */
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ffd97a;
    opacity: 0.6;
    animation: float 3.6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); opacity: 0.5; }
    50%      { transform: translateY(-12px); opacity: 0.9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sparkle { animation: none; }
  }
</style>
</head>
<body>

<div class="cd-app">

  <header class="cd-top reveal" data-d="1">
    <div class="cd-top__title">JAPAN TRIP · 2026 はる</div>
    <div class="cd-top__season">★ MAYA · 9 さい</div>
  </header>

  <div class="cd-counter reveal" data-d="2" aria-label="Countdown to Japan trip">
    <div class="cd-counter__pre">あと</div>
    <div class="cd-counter__num">27</div>
    <div class="cd-counter__post">にち!</div>
  </div>

  <article class="unlock-card reveal" data-d="3" aria-label="Today's unlocked page">
    <div class="unlock-card__star" aria-hidden="true">★</div>
    <div>
      <div class="unlock-card__label">きょう アンロック!</div>
      <div class="unlock-card__title">ねこカフェ ぴくちゃー · かなざわ</div>
    </div>
    <div class="unlock-card__arrow" aria-hidden="true">›</div>
  </article>

  <div class="lock-meta reveal" data-d="4">
    <span class="key">▸</span>あと 14 ぺーじ ロックちゅう
  </div>

  <footer class="cd-bottom reveal" data-d="5">
    <div class="avatars" aria-label="Family">
      <div class="avatar avatar--maya">M</div>
      <div class="avatar avatar--eli">E</div>
      <div class="avatar avatar--rachel">R</div>
      <div class="avatar avatar--david">D</div>
    </div>
    <button class="bedtime-btn" type="button">★ ねるまえ よみきかせ</button>
  </footer>

</div>

<script>
  if (new URLSearchParams(location.search).has('noframe')) document.body.classList.add('noframe');
</script>
</body>
</html>
