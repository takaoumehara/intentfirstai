<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya · なにが みたい? (iPad-kids)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8f1;
    --surface: #ffffff;
    --mint: #c9e8d6;
    --coral: #ffd6c8;
    --cream: #fff3d6;
    --lilac: #e6dcf2;
    --text: #2c2218;
    --text-2: #6b5a48;
    --text-3: #94836c;
    --font-sans: 'Geist', -apple-system, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    --font-jp: 'Noto Sans JP', var(--font-sans);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-jp);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
    overflow: hidden;
  }
  body.noframe { background: transparent; }

  .page {
    width: 100%;
    height: 100vh;
    padding: 26px 36px 32px;
    display: flex;
    flex-direction: column;
  }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .head__title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .head__sub {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.4px;
    color: var(--text-3);
    text-transform: uppercase;
  }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 18px;
  }

  .card {
    border-radius: 22px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .card--mint  { background: var(--mint); }
  .card--coral { background: var(--coral); }
  .card--cream { background: var(--cream); }
  .card--lilac { background: var(--lilac); }

  .card__photo {
    flex: 1;
    border-radius: 14px;
    background: var(--surface);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  .card__photo::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,200,160,0.45), transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(180,220,200,0.4), transparent 55%);
  }
  .card__photo span {
    position: relative;
    z-index: 2;
    font-family: var(--font-jp);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-2);
    text-align: center;
    padding: 0 12px;
  }

  .card__title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
    line-height: 1.2;
  }
  .card__row {
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    min-height: 52px;
    border-radius: 14px;
    border: none;
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-jp);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.06);
  }
  .btn--like {
    background: var(--text);
    color: #fff8f1;
  }

  .badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--text);
    color: #fff8f1;
    font-family: var(--font-jp);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 11px;
    border-radius: 999px;
    z-index: 4;
  }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).has('noframe')) document.body.classList.add('noframe');
</script>

<div class="page">
  <div class="head">
    <div class="head__title">なにが みたい?</div>
    <div class="head__sub">MAYA · 8 げつまえ · 4 つの カード</div>
  </div>

  <div class="grid">
    <div class="card card--cream">
      <div class="card__photo"><span>きんぱく · 金沢</span></div>
      <div class="card__title">きんぱく たいけん</div>
      <div class="card__row">
        <button class="btn">もっと みる</button>
        <button class="btn btn--like">すき!</button>
      </div>
    </div>

    <div class="card card--mint">
      <div class="card__photo"><span>ジブリ · おうち</span></div>
      <div class="card__title">ジブリの おうち</div>
      <div class="card__row">
        <button class="btn">もっと みる</button>
        <button class="btn btn--like">すき!</button>
      </div>
    </div>

    <div class="card card--lilac">
      <div class="card__photo"><span>おりがみ · ワークショップ</span></div>
      <div class="card__title">おりがみ ワークショップ</div>
      <div class="card__row">
        <button class="btn">もっと みる</button>
        <button class="btn btn--like">すき!</button>
      </div>
    </div>

    <div class="card card--coral">
      <span class="badge">おにいちゃんも すき!</span>
      <div class="card__photo"><span>ねこちゃん · カフェ</span></div>
      <div class="card__title">ねこちゃん カフェ</div>
      <div class="card__row">
        <button class="btn">もっと みる</button>
        <button class="btn btn--like">すき!</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
