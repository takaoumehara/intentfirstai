<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya · あさ Day 9 · あたらしいページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_screen.css">
<style>
  :root {
    --maya-mint:   #d4f0e0;
    --maya-coral:  #ffd9c4;
    --maya-cream:  #fff5d8;
    --maya-pink:   #ffe6f0;
    --maya-ink:    #2d2a1e;
    --maya-ink-2:  #6b6452;
  }
  body {
    font-family: 'Noto Sans JP', var(--font-sans);
    background: linear-gradient(180deg, #fffaf0 0%, #fff5e8 100%);
    color: var(--maya-ink);
  }
  body.noframe { background: linear-gradient(180deg, #fffaf0 0%, #fff5e8 100%); }

  .grew-app {
    padding: 24px 28px 28px;
    max-width: 1024px;
    margin: 0 auto;
  }
  body.noframe .grew-app { padding-top: 28px; }

  .grew-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .grew-head__title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: var(--maya-ink);
    text-transform: uppercase;
  }
  .grew-head__day {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--maya-ink-2);
    padding: 8px 12px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 2px 0 #f5d4dd;
  }

  /* Hero new page card */
  .new-hero {
    position: relative;
    border-radius: 26px;
    background: linear-gradient(135deg, #fff5d8 0%, #ffd9c4 50%, #ffd1e1 100%);
    padding: 28px 26px 26px;
    box-shadow: 0 6px 0 #f5c8a0;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .new-hero__badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 2px 0 rgba(0,0,0,0.05);
    font-size: 14px;
    font-weight: 700;
    color: #c87f5e;
    margin-bottom: 14px;
    animation: badge-pop 600ms var(--ease-out-quart) both;
  }
  @keyframes badge-pop {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .new-hero__badge .star {
    color: #f5a623;
    font-size: 16px;
    animation: spin 4s linear infinite;
    display: inline-block;
  }
  @keyframes spin {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
  }
  .new-hero__title {
    font-size: 32px;
    font-weight: 700;
    color: var(--maya-ink);
    line-height: 1.2;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .new-hero__sub {
    font-size: 16px;
    color: var(--maya-ink-2);
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .new-hero__cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    font-size: 16px;
    font-weight: 700;
    color: var(--maya-ink);
    border: none;
    cursor: pointer;
  }
  .new-hero__cta .arrow { color: #c87f5e; font-size: 20px; }

  /* Floating sparkles in hero */
  .new-hero__sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .sparkle {
    position: absolute;
    color: #ffd97a;
    font-size: 16px;
    animation: float 3.6s ease-in-out infinite;
  }
  .sparkle:nth-child(1) { top: 14%; right: 10%; animation-delay: 0s; }
  .sparkle:nth-child(2) { top: 70%; right: 22%; animation-delay: 1s; font-size: 12px; }
  .sparkle:nth-child(3) { top: 30%; right: 30%; animation-delay: 2s; font-size: 20px; }
  @keyframes float {
    0%, 100% { transform: translateY(0); opacity: 0.7; }
    50%      { transform: translateY(-10px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sparkle { animation: none; }
    .new-hero__badge { animation: none; }
    .new-hero__badge .star { animation: none; }
  }

  /* Section title */
  .grew-section-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--maya-ink);
    margin-bottom: 14px;
    margin-top: 4px;
  }

  /* Today small cards (existing 3) */
  .today-small {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }
  @media (max-width: 768px) { .today-small { grid-template-columns: 1fr; } }
  .ts-card {
    padding: 14px 16px;
    border-radius: 16px;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .ts-card--mint  { background: var(--maya-mint);  box-shadow: 0 3px 0 #b6e3c8; }
  .ts-card--coral { background: var(--maya-coral); box-shadow: 0 3px 0 #ffbfa0; }
  .ts-card--cream { background: var(--maya-cream); box-shadow: 0 3px 0 #ffe7a4; }
  .ts-card__time {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--maya-ink-2);
  }
  .ts-card__label {
    font-size: 16px;
    font-weight: 700;
    color: var(--maya-ink);
    line-height: 1.25;
  }

  /* Sibling note */
  .sib-note {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 4px 0 #d8c8f0;
  }
  .sib-note__avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #7c3aed;
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
  }
  .sib-note__text {
    flex: 1;
    font-size: 15px;
    color: var(--maya-ink);
    font-weight: 600;
    line-height: 1.4;
  }
  .sib-note__sub {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    color: #7c5fb5;
    letter-spacing: 1px;
    margin-top: 3px;
    text-transform: uppercase;
  }
  .sib-note__btn {
    padding: 10px 16px;
    border-radius: 12px;
    background: #7c3aed;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="grew-app">

  <header class="grew-head reveal" data-d="1">
    <div class="grew-head__title">MAYA · あさ 7:30 · DAY 09</div>
    <div class="grew-head__day">★ きょうと · はれ</div>
  </header>

  <article class="new-hero reveal" data-d="2" aria-label="A new page appeared overnight">
    <div class="new-hero__sparkles" aria-hidden="true">
      <span class="sparkle">★</span>
      <span class="sparkle">★</span>
      <span class="sparkle">★</span>
    </div>
    <div class="new-hero__badge">
      <span class="star">★</span> 新ページ
    </div>
    <div class="new-hero__title">あたらしい ぺーじ!<br>きょうとの おりがみワークショップ</div>
    <div class="new-hero__sub">よる の あいだに ぺーじが ふえたよ。<br>14:00 から 1じかん。よやく ずみ。</div>
    <button class="new-hero__cta" type="button">
      みてみる <span class="arrow">›</span>
    </button>
  </article>

  <h2 class="grew-section-title reveal" data-d="3">きょうの よてい</h2>
  <div class="today-small">
    <div class="ts-card ts-card--mint reveal" data-d="4">
      <div class="ts-card__time">9:00</div>
      <div class="ts-card__label">しんかんせん<br>きょうとへ</div>
    </div>
    <div class="ts-card ts-card--coral reveal" data-d="5">
      <div class="ts-card__time">12:30</div>
      <div class="ts-card__label">にしき いちば<br>おひるごはん</div>
    </div>
    <div class="ts-card ts-card--cream reveal" data-d="6">
      <div class="ts-card__time">14:00</div>
      <div class="ts-card__label">★ おりがみ<br>ワークショップ</div>
    </div>
  </div>

  <div class="sib-note reveal" data-d="7" aria-label="Sibling invitation">
    <div class="sib-note__avatar">E</div>
    <div>
      <div class="sib-note__text">おにいちゃんも さそってみる?</div>
      <div class="sib-note__sub">Eli にも おなじ おしらせ · あさ 7:30</div>
    </div>
    <button class="sib-note__btn" type="button">さそう</button>
  </div>

</div>

<script>
  if (new URLSearchParams(location.search).has('noframe')) document.body.classList.add('noframe');
</script>
</body>
</html>
