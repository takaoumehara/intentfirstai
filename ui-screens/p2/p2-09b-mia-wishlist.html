<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2-09b — Mia's Kyoto Wishlist</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: transparent;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
  }

  .screen {
    width: 390px;
    height: 844px;
    background: linear-gradient(180deg, #fff6ef 0%, #ffe9e4 100%);
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  }

  .scroll {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 70px 20px 40px;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    padding: 16px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-900);
    z-index: 10;
  }
  .status-right { display: flex; gap: 5px; align-items: center; font-size: 12px; }
  .battery { display: inline-block; width: 22px; height: 11px; border: 1px solid currentColor; border-radius: 2px; position: relative; }
  .battery::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 5px; background: currentColor; border-radius: 0 1px 1px 0; }
  .battery::before { content: ''; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 80%; background: currentColor; border-radius: 1px; }

  .user-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb3c1, #ff8aa0);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: white;
    box-shadow: 0 2px 6px rgba(255,138,160,0.3);
  }
  .user-info .name {
    font-size: 15px;
    font-weight: 700;
    color: var(--gray-900);
  }
  .user-info .age {
    font-size: 12px;
    color: var(--gray-600);
    font-weight: 500;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--gray-900);
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--gray-600);
    margin-bottom: 18px;
    font-weight: 500;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .card {
    background: white;
    border-radius: 18px;
    padding: 14px 12px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
    cursor: pointer;
    transition: transform 180ms cubic-bezier(0.2,0,0,1);
  }
  .card:active { transform: scale(0.96); }

  .emoji {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #fff0e8, #ffe0d6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin: 0 auto 8px;
  }
  .card-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--gray-900);
    text-align: center;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .heart-btn {
    width: 100%;
    padding: 8px 0;
    border-radius: 999px;
    border: 1.5px solid var(--gray-200);
    background: white;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-600);
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 180ms;
  }
  .heart-btn.liked {
    background: #ffe5ea;
    border-color: #ff6b86;
    color: #e91e4f;
  }
  .heart-btn .heart {
    font-size: 14px;
    transition: transform 200ms cubic-bezier(0.2,0,0,1);
  }
  .heart-btn.liked .heart { transform: scale(1.2); }

  .summary {
    margin-top: 18px;
    background: white;
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .summary-label {
    font-size: 11px;
    font-weight: 700;
    color: #e91e4f;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .summary-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-800);
    line-height: 1.5;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--gray-900);
    opacity: 0.25;
    border-radius: 999px;
    z-index: 10;
  }

  body.noframe { background: transparent !important; padding: 0; }
  body.noframe .screen {
    width: 100vw; height: 100vh;
    background: linear-gradient(180deg, #fff6ef 0%, #ffe9e4 100%);
    border-radius: 0;
    box-shadow: none;
  }
  body.noframe .home-indicator { display: none !important; }
</style>
</head>
<body>

<div class="screen">
  <div class="status-bar">
    <span>11:47 AM</span>
    <div class="status-right">
      <span>•••</span>
      <span>≡</span>
      <span class="battery"></span>
    </div>
  </div>

  <div class="scroll">
    <div class="user-bar">
      <div class="avatar">M</div>
      <div class="user-info">
        <div class="name">Mia</div>
        <div class="age">age 9 · kid profile</div>
      </div>
    </div>

    <h1 class="title">What do you want to<br>do in Kyoto?</h1>
    <p class="subtitle">Tap the ♡ on things that look fun!</p>

    <div class="grid">
      <div class="card">
        <div class="emoji">🏺</div>
        <div class="card-name">Pottery<br>workshop</div>
        <button class="heart-btn liked" onclick="toggleHeart(this)">
          <span class="heart">♥</span> Loved
        </button>
      </div>

      <div class="card">
        <div class="emoji">🎋</div>
        <div class="card-name">Bamboo<br>weaving</div>
        <button class="heart-btn liked" onclick="toggleHeart(this)">
          <span class="heart">♥</span> Loved
        </button>
      </div>

      <div class="card">
        <div class="emoji">📜</div>
        <div class="card-name">Washi paper<br>making</div>
        <button class="heart-btn liked" onclick="toggleHeart(this)">
          <span class="heart">♥</span> Loved
        </button>
      </div>

      <div class="card">
        <div class="emoji">👘</div>
        <div class="card-name">Kimono<br>try-on</div>
        <button class="heart-btn" onclick="toggleHeart(this)">
          <span class="heart">♡</span> Add
        </button>
      </div>

      <div class="card">
        <div class="emoji">🍡</div>
        <div class="card-name">Sweets<br>making</div>
        <button class="heart-btn liked" onclick="toggleHeart(this)">
          <span class="heart">♥</span> Loved
        </button>
      </div>

      <div class="card">
        <div class="emoji">🍱</div>
        <div class="card-name">Food sample<br>factory</div>
        <button class="heart-btn" onclick="toggleHeart(this)">
          <span class="heart">♡</span> Add
        </button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-label">Mia's picks · 4 loved</div>
      <div class="summary-text">Pottery · Bamboo weaving · Washi paper · Sweets making</div>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
  function toggleHeart(btn) {
    const liked = btn.classList.toggle('liked');
    btn.innerHTML = liked
      ? '<span class="heart">♥</span> Loved'
      : '<span class="heart">♡</span> Add';
  }
  if (new URLSearchParams(location.search).get('noframe') === '1') {
    document.body.classList.add('noframe');
  }
</script>
</body>
</html>
