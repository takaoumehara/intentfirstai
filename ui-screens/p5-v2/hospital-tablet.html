<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User UI · Hospital Tablet · Code Blue Broadcast | P5 Cross-Surface</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #010102; }
  body {
    font-family: 'Geist', sans-serif;
    color: #f7f8f8;
    display: flex;
    padding: 20px;
  }
  body.noframe {
    background: transparent !important;
    padding: 0 !important;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #010102;
    border: 1px solid #23252a;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden;
  }

  /* Critical Banner */
  .alert-banner {
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-shrink: 0;
  }
  .alert-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .alert-tag {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    color: #ef4444;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.1em;
  }
  .alert-title {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    color: #fff;
  }
  .alert-timer {
    font-family: 'Geist Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: #ef4444;
  }

  /* Grid details */
  .grid-layout {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 20px;
    flex: 1;
    min-height: 0;
  }

  /* Vitals card */
  .vitals-card {
    background: #0f1011;
    border: 1px solid #23252a;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .vitals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .vital-box {
    background: #050506;
    border: 1px solid #1c1c1e;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .vital-label {
    font-family: 'Geist Mono', monospace;
    font-size: 9.5px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
  }
  .vital-value {
    font-family: 'Geist Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    color: #ef4444;
  }
  .vital-value.normal {
    color: #27a644;
  }

  /* Team list */
  .team-card {
    background: #0f1011;
    border: 1px solid #23252a;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  .team-title {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin: 0;
  }
  .team-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .team-member {
    background: #050506;
    border: 1px solid #1c1c1e;
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .team-status {
    font-family: 'Geist Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .status--enroute { background: rgba(232, 165, 87, 0.12); color: #e8a557; }
  .status--active { background: rgba(39, 166, 68, 0.12); color: #27a644; }

  /* Actions */
  .actions {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex-shrink: 0;
  }
  .btn {
    height: 48px;
    border-radius: 8px;
    border: 0;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn--primary { background: #ef4444; color: #fff; }
  .btn--secondary { background: #141516; border: 1px solid #23252a; color: rgba(255, 255, 255, 0.8); }
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('noframe')==='1')document.body.classList.add('noframe');</script>

<div class="screen">
  <!-- Critical Alert Banner -->
  <div class="alert-banner">
    <div class="alert-info">
      <span class="alert-tag">Critical Broadcast</span>
      <h1 class="alert-title">Code Blue · Room 402 (Resus Bay)</h1>
    </div>
    <div class="alert-timer">01:14</div>
  </div>

  <!-- Grid Details -->
  <div class="grid-layout">
    
    <!-- Vitals Panel -->
    <div class="vitals-card">
      <span class="team-title">Patient telemetry</span>
      <div class="vitals-grid">
        <div class="vital-box">
          <span class="vital-label">Heart Rate (bpm)</span>
          <span class="vital-value">0 (Asystole)</span>
        </div>
        <div class="vital-box">
          <span class="vital-label">SpO2 (%)</span>
          <span class="vital-value">--</span>
        </div>
        <div class="vital-box">
          <span class="vital-label">Blood Pressure</span>
          <span class="vital-value">-- / --</span>
        </div>
        <div class="vital-box">
          <span class="vital-label">Respiration</span>
          <span class="vital-value">0</span>
        </div>
      </div>
    </div>

    <!-- Active Team Panel -->
    <div class="team-card">
      <h2 class="team-title">Response team</h2>
      <div class="team-list">
        <div class="team-member">
          <span>Dr. Ines Jensen (ED Attending)</span>
          <span class="team-status status--enroute">En Route</span>
        </div>
        <div class="team-member">
          <span>Nurse Mateo (Charge Nurse)</span>
          <span class="team-status status--active">Active</span>
        </div>
        <div class="team-member">
          <span>RT Sorenson (Respiratory)</span>
          <span class="team-status status--active">Active</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Action Row -->
  <div class="actions">
    <button class="btn btn--secondary" onclick="alert('Backup requested.')">Request Backup</button>
    <button class="btn btn--primary" onclick="alert('Code acknowledged.')">Acknowledge Code</button>
  </div>
</div>
</body>
</html>
