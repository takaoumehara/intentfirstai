<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User UI · Galaxy Watch · Day 13 Driver Mode | P6 Life Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #1a1a1c;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    font-family: 'Geist', sans-serif;
  }
  body.noframe {
    background: transparent !important;
    min-height: auto !important;
    padding: 0 !important;
    display: block;
  }
  body.noframe .qa-frame { display: none; }

  .face {
    position: absolute;
    inset: 0;
    background: #000;
    color: #fff;
    overflow: hidden;
    display: grid;
    grid-template-rows: 24px 1fr auto;
    padding: 12px 14px;
    font-family: 'Geist', sans-serif;
    container-type: inline-size;
  }
  body.noframe .face {
    position: relative;
    width: 100vw;
    height: 100vh;
    inset: auto;
  }

  /* Header */
  .face__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px;
  }
  .face__app {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .face__app-mark {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e8a557; /* Amber alert tone */
    box-shadow: 0 0 6px #e8a557;
  }
  .face__app-name {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
    line-height: 1;
  }
  .face__time {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
  }

  /* Body */
  .face__body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 2px 4px;
  }
  .face__title {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.2;
    color: #fff;
    margin: 0;
  }
  .face__sub {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    color: #e8a557;
    margin: 0;
  }

  /* Agent Grid */
  .agent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: 6px;
  }
  .agent-box {
    background: #0f1011;
    border: 1px solid #23252a;
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .agent-name {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.7);
  }
  .agent-status {
    font-family: 'Geist Mono', monospace;
    font-size: 8px;
    color: rgba(255, 255, 255, 0.35);
    text-transform: uppercase;
  }

  /* Footer */
  .face__actions {
    display: flex;
    justify-content: center;
    width: 100%;
  }
  .btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    font-weight: 600;
    height: 34px;
    width: 100%;
    border-radius: 17px;
    border: 1px solid #23252a;
    background: #0f1011;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn:active { background: #141516; }
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('noframe')==='1')document.body.classList.add('noframe');</script>

<div class="face">
  <!-- Header -->
  <header class="face__header">
    <div class="face__app">
      <span class="face__app-mark"></span>
      <span class="face__app-name">System</span>
    </div>
    <time class="face__time">19:15</time>
  </header>

  <!-- Body -->
  <main class="face__body">
    <h1 class="face__title">Driver Mode</h1>
    <p class="face__sub">19:00 — 23:00</p>
    
    <div class="agent-grid">
      <div class="agent-box">
        <span class="agent-name">Health</span>
        <span class="agent-status">silent</span>
      </div>
      <div class="agent-box">
        <span class="agent-name">Finance</span>
        <span class="agent-status">silent</span>
      </div>
      <div class="agent-box">
        <span class="agent-name">Location</span>
        <span class="agent-status">silent</span>
      </div>
      <div class="agent-box">
        <span class="agent-name">Shopping</span>
        <span class="agent-status">silent</span>
      </div>
    </div>
  </main>

  <!-- Actions -->
  <footer class="face__actions">
    <button class="btn" onclick="alert('Driver Mode Disabled')">Manual OFF</button>
  </footer>
</div>
</body>
</html>
