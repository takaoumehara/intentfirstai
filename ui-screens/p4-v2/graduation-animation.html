<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Brain Graduation — three layers, three fates</title>
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --text: #1a1816;
    --text-2: #4a4742;
    --text-3: #7a766f;
    --border: rgba(10,10,10,0.10);
    --now:      #3a7a4a;
    --learning: #4a6a90;
    --identity: #6a4a90;
    --org:      #a07040;
    --font-sans: 'Geist', -apple-system, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 32px 48px;
    display: flex;
    flex-direction: column;
  }
  .stage__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
  }
  .stage__title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .stage__t {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--text-3);
    text-transform: uppercase;
  }

  .canvas {
    flex: 1;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 28px 36px;
    overflow: hidden;
  }

  /* Org Brain — base receiver */
  .org-brain {
    position: absolute;
    bottom: 28px;
    left: 36px;
    right: 36px;
    height: 60px;
    border: 2px dashed var(--org);
    border-radius: 10px;
    background: rgba(160,112,64,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--org);
  }

  /* Project Brain (top) — shows 3 layers */
  .project {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .project__head {
    padding: 10px 14px;
    background: rgba(10,10,10,0.025);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--text-2);
  }
  .layer {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: opacity 800ms ease, transform 1200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .layer:last-child { border-bottom: 0; }
  .layer__bar {
    width: 4px;
    height: 28px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .layer--now      .layer__bar { background: var(--now); }
  .layer--learning .layer__bar { background: var(--learning); }
  .layer--identity .layer__bar { background: var(--identity); }
  .layer__name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .layer__sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.5px;
    margin-left: auto;
  }

  /* Animated trails */
  .trail {
    position: absolute;
    pointer-events: none;
    opacity: 0;
  }
  .trail__label {
    position: absolute;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Archive (bottom-right) */
  .archive {
    position: absolute;
    bottom: 100px;
    right: 60px;
    width: 110px;
    height: 80px;
    border: 1px solid var(--identity);
    border-radius: 8px;
    background: rgba(106,74,144,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--identity);
    opacity: 0;
    transition: opacity 800ms ease;
  }
  .archive__icon {
    font-size: 18px;
    line-height: 1;
  }

  /* Now → evaporates */
  .vapor {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--now);
    opacity: 0;
  }
  @keyframes evaporate {
    0%   { opacity: 0.8; transform: translateY(0) scale(1); }
    100% { opacity: 0;   transform: translateY(-80px) scale(0.3); }
  }

  /* Learning → flows down */
  @keyframes flow-to-org {
    0%   { opacity: 0; transform: translate(0, 0); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(0, 200px); }
  }
  .flow {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--learning), transparent);
    opacity: 0;
  }

  /* Identity → flies to archive */
  @keyframes flow-to-archive {
    0%   { opacity: 0; transform: translate(0, 0) scale(1); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translate(180px, 100px) scale(0.7); }
  }

  /* State classes — driven by JS */
  .state-1 .layer--now      { opacity: 1; transform: translateX(0); }
  .state-1 .layer--learning { opacity: 1; transform: translateX(0); }
  .state-1 .layer--identity { opacity: 1; transform: translateX(0); }

  .state-2 .layer--now      { opacity: 0.18; transform: translateX(0); }
  .state-2 .layer--learning { opacity: 1; }
  .state-2 .layer--identity { opacity: 1; }

  .state-3 .layer--now      { opacity: 0.18; }
  .state-3 .layer--learning { opacity: 0.18; transform: translateY(40px); }
  .state-3 .layer--identity { opacity: 1; }
  .state-3 .org-brain {
    background: rgba(160,112,64,0.18);
    border-style: solid;
  }

  .state-4 .layer--now      { opacity: 0.12; }
  .state-4 .layer--learning { opacity: 0.12; transform: translateY(40px); }
  .state-4 .layer--identity { opacity: 0.18; transform: translateX(140px) scale(0.8); }
  .state-4 .archive { opacity: 1; }

  /* Caption ribbon */
  .caption {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 18px;
    white-space: nowrap;
    transition: opacity 600ms ease;
  }

  /* Step pips */
  .pips {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .pip {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border);
    transition: background 400ms ease, transform 400ms ease;
  }
  .pip.active { background: var(--text); transform: scale(1.3); }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .layer { transition: opacity 100ms ease; }
    .archive { transition: opacity 100ms ease; }
    .caption { transition: none; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="stage__head">
    <div class="stage__title">Project Brain · graduation</div>
    <div class="stage__t">three layers · three fates</div>
  </div>

  <div class="canvas" id="canvas">

    <!-- Project Brain card with three layers -->
    <div class="project">
      <div class="project__head">Project Brain · Holiday Campaign 2026</div>
      <div class="layer layer--now">
        <span class="layer__bar"></span>
        <span class="layer__name">Now Layer</span>
        <span class="layer__sub">in flux</span>
      </div>
      <div class="layer layer--learning">
        <span class="layer__bar"></span>
        <span class="layer__name">Learning Layer</span>
        <span class="layer__sub">accumulates</span>
      </div>
      <div class="layer layer--identity">
        <span class="layer__bar"></span>
        <span class="layer__name">Identity Layer</span>
        <span class="layer__sub">survives</span>
      </div>
    </div>

    <!-- Archive (Identity destination) -->
    <div class="archive" aria-hidden="true">
      <div class="archive__icon">📦</div>
      <div>Archive</div>
    </div>

    <!-- Org Brain (Learning destination) -->
    <div class="org-brain">Org Brain · receives Learning</div>

    <!-- Caption -->
    <div class="caption" id="caption">Step 1 · The project runs · all three layers active.</div>
  </div>

  <div class="pips" aria-hidden="true">
    <span class="pip active" data-pip="1"></span>
    <span class="pip" data-pip="2"></span>
    <span class="pip" data-pip="3"></span>
    <span class="pip" data-pip="4"></span>
  </div>

</div>

<script>
  const canvas = document.getElementById('canvas');
  const caption = document.getElementById('caption');
  const pips = document.querySelectorAll('.pip');

  const steps = [
    { state: 'state-1', text: 'Step 1 · The project runs · all three layers active.' },
    { state: 'state-2', text: 'Step 2 · Project closes · Now Layer evaporates.' },
    { state: 'state-3', text: 'Step 3 · Learning Layer dissolves into Org Brain.' },
    { state: 'state-4', text: 'Step 4 · Identity Layer compresses into the Archive.' }
  ];

  let i = 0;
  function applyStep(idx) {
    canvas.className = 'canvas ' + steps[idx].state;
    caption.style.opacity = 0;
    setTimeout(() => {
      caption.textContent = steps[idx].text;
      caption.style.opacity = 1;
    }, 220);
    pips.forEach((p, k) => p.classList.toggle('active', k === idx));
  }

  // Initial state
  applyStep(0);

  // Auto-advance loop
  function tick() {
    i = (i + 1) % steps.length;
    applyStep(i);
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    setInterval(tick, 3200);
  }
</script>

</body>
</html>
