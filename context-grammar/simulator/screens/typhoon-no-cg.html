<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No CG · 運休お知らせ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px 6px;
}
.status-bar__time { font-size: 14px; font-weight: 700; }
.status-bar__icons { font-size: 10px; color: var(--text-2); }

/* App header — 鉄道アプリっぽい */
.app-header {
  background: #1a1a2e;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.app-header__back { color: rgba(255,255,255,0.6); font-size: 18px; }
.app-header__title { font-size: 15px; font-weight: 600; color: #fff; }

/* Alert banner */
.alert-banner {
  background: #dc2626;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.alert-banner__icon { font-size: 16px; }
.alert-banner__text { font-size: 12px; font-weight: 600; color: #fff; line-height: 1.3; }

/* Main content */
.main { flex: 1; overflow-y: auto; }

.notice-block {
  padding: 20px 16px;
  border-bottom: 1px solid var(--border);
}
.notice-block__date {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.notice-block__title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.3;
}
.notice-block__body {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.7;
}

.divider-label {
  padding: 10px 16px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
}

.link-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  color: var(--text);
}
.link-row__arrow { color: var(--text-3); }

.dead-end {
  padding: 32px 20px;
  text-align: center;
}
.dead-end__icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
.dead-end__text {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.7;
}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('noframe')==='1')document.body.classList.add('noframe');</script>

<div class="status-bar">
  <span class="status-bar__time">17:45</span>
  <span class="status-bar__icons">●●● 🔋</span>
</div>

<div class="app-header">
  <span class="app-header__back">‹</span>
  <span class="app-header__title">運行情報</span>
</div>

<div class="alert-banner">
  <span class="alert-banner__icon">⚠️</span>
  <div class="alert-banner__text">東海道新幹線 運転見合わせ中</div>
</div>

<div class="main">

  <div class="notice-block">
    <div class="notice-block__date">2026年5月13日 17:38 更新</div>
    <div class="notice-block__title">台風4号接近に伴う運転見合わせのお知らせ</div>
    <div class="notice-block__body">
      台風4号の接近に伴い、東海道新幹線は現在全列車の運転を見合わせております。<br><br>
      運転再開の見込みは現時点では未定です。情報が入り次第、随時更新いたします。<br><br>
      お客様にはご不便をおかけして誠に申し訳ございません。
    </div>
  </div>

  <div class="divider-label">関連リンク</div>
  <div class="link-row">JR東海 公式サイト <span class="link-row__arrow">›</span></div>
  <div class="link-row">払い戻し・変更手続き <span class="link-row__arrow">›</span></div>
  <div class="link-row">代替交通手段 <span class="link-row__arrow">›</span></div>

  <div class="dead-end">
    <div class="dead-end__icon">🔍</div>
    <div class="dead-end__text">
      代替手段は自分で検索してください。<br>
      飛行機・高速バス・ホテルは別アプリで。<br>
      予算・残席・時間の比較はご自身で。
    </div>
  </div>

</div>
</body>
</html>
