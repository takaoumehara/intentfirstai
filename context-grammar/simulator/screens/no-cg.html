<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No CG — Recipe App</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  overflow-y: auto;
}
body.noframe { /* no changes needed */ }

/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
}
.status-bar__time { font-family: var(--font-sans); font-size: 14px; font-weight: 700; }
.status-bar__icons { display: flex; gap: 5px; align-items: center; font-size: 10px; }

/* Header */
.app-header {
  padding: 8px 16px 10px;
}
.app-header__title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 10px;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--gray-100);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--text-3);
}
.search-bar__icon { font-size: 14px; }

/* Filters */
.filters {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  padding: 5px 12px;
  background: var(--gray-100);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
}
.filter-chip.active {
  background: var(--text);
  color: var(--bg);
}

/* Section label */
.section-label {
  padding: 10px 16px 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.2px;
}

/* Recipe cards */
.recipe-list {
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 80px;
}
.recipe-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg);
}
.recipe-card__img {
  height: 80px;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}
.recipe-card__body { padding: 10px 12px; }
.recipe-card__title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.recipe-card__meta {
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  gap: 8px;
}
.recipe-card__meta span::before { content: '· '; color: var(--gray-300); }
.recipe-card__meta span:first-child::before { content: ''; }

/* Tabbar */
.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: flex;
  height: 60px;
  padding-bottom: 8px;
}
.tabbar__item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 9px;
  font-weight: 500;
  color: var(--text-3);
}
.tabbar__item.active { color: var(--text); }
.tabbar__icon { font-size: 18px; }
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('noframe')==='1')document.body.classList.add('noframe');</script>

<div class="status-bar">
  <span class="status-bar__time">18:04</span>
  <div class="status-bar__icons">
    <span>●●●</span>
    <span>WiFi</span>
    <span>🔋</span>
  </div>
</div>

<div class="app-header">
  <div class="app-header__title">今夜のごはん</div>
  <div class="search-bar">
    <span class="search-bar__icon">🔍</span>
    <span>レシピを検索</span>
  </div>
</div>

<div class="filters">
  <div class="filter-chip active">すべて</div>
  <div class="filter-chip">和食</div>
  <div class="filter-chip">洋食</div>
  <div class="filter-chip">中華</div>
  <div class="filter-chip">30分以内</div>
  <div class="filter-chip">カロリー低め</div>
  <div class="filter-chip">冷蔵庫の材料</div>
</div>

<div class="section-label">人気レシピ 20件</div>

<div class="recipe-list">
  <div class="recipe-card">
    <div class="recipe-card__img">🍗</div>
    <div class="recipe-card__body">
      <div class="recipe-card__title">鶏の照り焼き丼</div>
      <div class="recipe-card__meta">
        <span>25分</span><span>簡単</span><span>628kcal</span>
      </div>
    </div>
  </div>
  <div class="recipe-card">
    <div class="recipe-card__img">🍝</div>
    <div class="recipe-card__body">
      <div class="recipe-card__title">カルボナーラ</div>
      <div class="recipe-card__meta">
        <span>20分</span><span>普通</span><span>720kcal</span>
      </div>
    </div>
  </div>
  <div class="recipe-card">
    <div class="recipe-card__img">🥘</div>
    <div class="recipe-card__body">
      <div class="recipe-card__title">肉じゃが</div>
      <div class="recipe-card__meta">
        <span>40分</span><span>普通</span><span>480kcal</span>
      </div>
    </div>
  </div>
  <div class="recipe-card">
    <div class="recipe-card__img">🍜</div>
    <div class="recipe-card__body">
      <div class="recipe-card__title">豚キムチ炒め</div>
      <div class="recipe-card__meta">
        <span>15分</span><span>簡単</span><span>540kcal</span>
      </div>
    </div>
  </div>
  <div class="recipe-card">
    <div class="recipe-card__img">🐟</div>
    <div class="recipe-card__body">
      <div class="recipe-card__title">鮭のムニエル</div>
      <div class="recipe-card__meta">
        <span>20分</span><span>普通</span><span>390kcal</span>
      </div>
    </div>
  </div>
</div>

<div class="tabbar">
  <div class="tabbar__item active">
    <span class="tabbar__icon">🏠</span>
    <span>ホーム</span>
  </div>
  <div class="tabbar__item">
    <span class="tabbar__icon">🔍</span>
    <span>探す</span>
  </div>
  <div class="tabbar__item">
    <span class="tabbar__icon">📋</span>
    <span>保存済み</span>
  </div>
  <div class="tabbar__item">
    <span class="tabbar__icon">👤</span>
    <span>アカウント</span>
  </div>
</div>

</body>
</html>
