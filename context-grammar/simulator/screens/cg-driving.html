<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG · Driving — 18:04</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px 6px;
}
.status-bar__time { font-size: 14px; font-weight: 700; }
.status-bar__icons { display: flex; gap: 4px; font-size: 10px; color: var(--text-2); }

/* Context badge — driving */
.ctx-bar {
  margin: 0 16px 0;
  padding: 6px 12px;
  background: var(--gray-100);
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-3);
}
.ctx-bar__dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--color-success);
  flex-shrink: 0;
}
.ctx-bar__text { font-family: var(--font-mono); letter-spacing: 0.2px; }

/* Main content — centered, minimal */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 20px 24px;
  gap: 20px;
}

/* ETA */
.eta-block {
  text-align: center;
}
.eta-block__label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.eta-block__value {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1.5px;
  color: var(--text);
  line-height: 1;
}
.eta-block__sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
}

/* The ONE card */
.suggestion-card {
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  background: var(--bg);
}
.suggestion-card__body {
  padding: 18px 18px 0;
}
.suggestion-card__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
}
.suggestion-card__dish {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 4px;
}
.suggestion-card__meta {
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
}
.meta-dot { color: var(--gray-300); }

.suggestion-card__cta {
  padding: 14px 18px 16px;
  border-top: 1px solid var(--border);
}
.btn-confirm {
  width: 100%;
  padding: 13px;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.2px;
}

/* Quiet note */
.quiet-note {
  text-align: center;
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.5;
}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('noframe')==='1')document.body.classList.add('noframe');</script>

<div class="status-bar">
  <span class="status-bar__time">18:04</span>
  <div class="status-bar__icons">
    <span>●●●</span><span>🔋</span>
  </div>
</div>

<div class="ctx-bar">
  <span class="ctx-bar__dot"></span>
  <span class="ctx-bar__text">運転中 · あと 18分で帰宅</span>
</div>

<div class="main">

  <div class="eta-block">
    <div class="eta-block__label">到着予定</div>
    <div class="eta-block__value">18:22</div>
    <div class="eta-block__sub">自宅まで 6.2km</div>
  </div>

  <div class="suggestion-card">
    <div class="suggestion-card__body">
      <div class="suggestion-card__label">今夜のごはん</div>
      <div class="suggestion-card__dish">鶏の照り焼き丼</div>
      <div class="suggestion-card__meta">
        <span>材料あり</span>
        <span class="meta-dot">·</span>
        <span>25分</span>
        <span class="meta-dot">·</span>
        <span>家族全員 ◎</span>
      </div>
    </div>
    <div class="suggestion-card__cta">
      <button class="btn-confirm">これにする</button>
    </div>
  </div>

  <div class="quiet-note">他の候補は帰宅後に確認できます</div>

</div>

</body>
</html>
