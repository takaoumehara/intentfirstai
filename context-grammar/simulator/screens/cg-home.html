<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG · Home — 18:22</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px 6px;
}
.status-bar__time { font-size: 14px; font-weight: 700; }
.status-bar__icons { display: flex; gap: 4px; font-size: 10px; color: var(--text-2); }

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px 20px 24px;
  gap: 16px;
}

/* Welcome */
.welcome {
  padding-top: 8px;
}
.welcome__greeting {
  font-size: 11px;
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.welcome__name {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -1px;
  color: var(--text);
  line-height: 1.1;
}
.welcome__sub {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 4px;
}

/* Tonight card */
.tonight-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
}
.tonight-card__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 10px;
}
.tonight-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.tonight-dish {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.tonight-meta {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}
.status-chip {
  flex-shrink: 0;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(5,150,105,0.1);
  color: var(--color-success);
}
.cook-bar {
  margin-top: 12px;
  height: 3px;
  background: var(--gray-100);
  border-radius: 2px;
  overflow: hidden;
}
.cook-bar__fill {
  height: 100%;
  width: 0%;
  background: var(--color-success);
  border-radius: 2px;
  transition: width 2s ease;
}

/* Guest status */
.guest-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.guest-status__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--chip-amber-text);
  flex-shrink: 0;
}
.guest-status__text { font-size: 13px; color: var(--text); }
.guest-status__sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }

/* Action cards */
.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.action-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}
.action-card__icon { font-size: 20px; margin-bottom: 6px; }
.action-card__title { font-size: 12px; font-weight: 600; color: var(--text); }
.action-card__sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* Quiet note */
.quiet {
  text-align: center;
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.5;
  padding: 0 8px;
}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('noframe')==='1')document.body.classList.add('noframe');</script>

<div class="status-bar">
  <span class="status-bar__time">18:22</span>
  <div class="status-bar__icons"><span>●●●</span><span>🔋</span></div>
</div>

<div class="main">

  <div class="welcome">
    <div class="welcome__greeting">おかえりなさい</div>
    <div class="welcome__name">Sota</div>
    <div class="welcome__sub">お疲れ様でした。ゆっくりどうぞ。</div>
  </div>

  <div class="tonight-card">
    <div class="tonight-card__label">今夜のごはん</div>
    <div class="tonight-row">
      <div>
        <div class="tonight-dish">鶏の照り焼き丼</div>
        <div class="tonight-meta">4人分 · Yuki が準備中</div>
      </div>
      <div class="status-chip">準備中</div>
    </div>
    <div class="cook-bar">
      <div class="cook-bar__fill" id="cook-bar-fill"></div>
    </div>
  </div>

  <div class="guest-status">
    <div class="guest-status__dot"></div>
    <div>
      <div class="guest-status__text">田中さん · リビングにいます</div>
      <div class="guest-status__sub">ワインの準備ができています</div>
    </div>
  </div>

  <div class="action-row">
    <div class="action-card">
      <div class="action-card__icon">🛒</div>
      <div class="action-card__title">明日の買い物</div>
      <div class="action-card__sub">ミルク · 卵 · 2点</div>
    </div>
    <div class="action-card">
      <div class="action-card__icon">📅</div>
      <div class="action-card__title">明日の予定</div>
      <div class="action-card__sub">9:00 チームMTG</div>
    </div>
  </div>

  <div class="quiet">それ以外の通知は後回しにしています</div>

</div>

<script>
setTimeout(() => {
  const fill = document.getElementById('cook-bar-fill');
  if (fill) fill.style.width = '40%';
}, 300);
</script>

</body>
</html>
