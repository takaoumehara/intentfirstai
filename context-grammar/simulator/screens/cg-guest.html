<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG · Guest Arrived — 18:06</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;
}

/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px 6px;
}
.status-bar__time { font-size: 14px; font-weight: 700; }
.status-bar__icons { display: flex; gap: 4px; font-size: 10px; color: var(--text-2); }

/* Guest arrival banner */
.guest-banner {
  margin: 4px 16px 0;
  padding: 10px 14px;
  background: var(--chip-amber-bg);
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.guest-banner__icon { font-size: 18px; flex-shrink: 0; }
.guest-banner__text { }
.guest-banner__title {
  font-size: 13px;
  font-weight: 600;
  color: var(--chip-amber-text);
  line-height: 1.2;
}
.guest-banner__sub {
  font-size: 11px;
  color: var(--chip-amber-text);
  opacity: 0.75;
}

/* Mode label */
.mode-label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 16px 8px;
}
.mode-label__dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--chip-amber-text);
}
.mode-label__text {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
}

/* Content */
.content { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }

/* Guest info card */
.guest-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
}
.guest-card__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 10px;
}
.guest-profile {
  display: flex;
  align-items: center;
  gap: 10px;
}
.guest-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--gray-200);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.guest-profile__name { font-size: 15px; font-weight: 600; color: var(--text); }
.guest-profile__meta { font-size: 11px; color: var(--text-3); }
.guest-pref {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
}
.pref-tag {
  display: inline-block;
  padding: 2px 7px;
  background: var(--gray-100);
  border-radius: 4px;
  font-size: 11px;
  color: var(--text-2);
  margin-right: 4px;
  margin-top: 4px;
}

/* Wine recommendation */
.wine-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
}
.wine-card__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 10px;
}
.wine-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.wine-icon {
  font-size: 28px;
  flex-shrink: 0;
}
.wine-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.wine-meta { font-size: 11px; color: var(--text-3); line-height: 1.5; }
.wine-card__cta {
  margin-top: 12px;
  padding: 10px;
  background: var(--text);
  color: var(--bg);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}

/* Dinner note */
.dinner-note {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.dinner-note__icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

/* Hidden info notice */
.hidden-notice {
  padding: 10px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.hidden-notice__icon { font-size: 12px; }
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get('noframe')==='1')document.body.classList.add('noframe');</script>

<div class="status-bar">
  <span class="status-bar__time">18:06</span>
  <div class="status-bar__icons"><span>●●●</span><span>🔋</span></div>
</div>

<div class="guest-banner">
  <span class="guest-banner__icon">🚪</span>
  <div class="guest-banner__text">
    <div class="guest-banner__title">田中さんが到着しました</div>
    <div class="guest-banner__sub">Yuki が玄関で応対中</div>
  </div>
</div>

<div class="mode-label">
  <span class="mode-label__dot"></span>
  <span class="mode-label__text">Guest Mode · プライベート情報を保護中</span>
</div>

<div class="content">

  <div class="guest-card">
    <div class="guest-card__label">来客情報</div>
    <div class="guest-profile">
      <div class="guest-avatar">👤</div>
      <div>
        <div class="guest-profile__name">田中 雄一</div>
        <div class="guest-profile__meta">Sota の会社の同僚 · 3回目の来訪</div>
      </div>
    </div>
    <div class="guest-pref">
      好み：
      <span class="pref-tag">🍷 ワイン好き</span>
      <span class="pref-tag">🥩 肉料理 OK</span>
      <span class="pref-tag">アレルギーなし</span>
    </div>
  </div>

  <div class="wine-card">
    <div class="wine-card__label">田中さんへのおすすめ</div>
    <div class="wine-row">
      <span class="wine-icon">🍷</span>
      <div>
        <div class="wine-name">赤ワイン · フルボディ</div>
        <div class="wine-meta">照り焼き丼に合う · 近くのコンビニで購入可<br>¥1,200 · 徒歩 2分</div>
      </div>
    </div>
    <div class="wine-card__cta">帰りに寄る</div>
  </div>

  <div class="dinner-note">
    <span class="dinner-note__icon">🍗</span>
    <span>鶏の照り焼き丼の予定を <strong>4人分</strong> に変更しました。材料は足ります。</span>
  </div>

  <div class="hidden-notice">
    <span class="hidden-notice__icon">🔒</span>
    <span>家族の健康情報・購入履歴・予算は非表示中</span>
  </div>

</div>

</body>
</html>
